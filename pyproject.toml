[project]
name = "basics-of-ai-agh"
version = "1.0.0"
description = "Basics of Artificial Intelligence course at AGH"
authors = []
readme = "README.md"
requires-python = ">=3.11,<3.14"

dependencies = [
    "imbalanced-learn>=0.14.0",
    "jupyter",
    "jupyterlab-execute-time",
    "jupytext",
    "librecommender>=1.5.2",
    "lightgbm==4.*",
    "matplotlib",
    "numba>=0.63.1",
    "numpy",
    "opencv-python>=4.11.0.86",
    "pandas",
    "scikit-learn>=1.7.2",
    "scikit-surprise>=1.1.4",
    "statsmodels>=0.14.5",
    "tensorflow>=2.18.1",
    "torch>=2.8.0",
    "torchvision>=0.23.0",
    "notebook>=7.5.4",
    "keras>=3.13.2",
    "adversarial-robustness-toolbox>=1.20.1",
    "tensorflow-metal>=1.2.0",
]


[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.uv]
package = false
